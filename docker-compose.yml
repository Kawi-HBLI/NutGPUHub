# Local run of the production image with its own PostgreSQL (Lab 5, Issue Lab5-3).
#   docker compose up --build -d     then open http://localhost:3000
#   docker compose down              stop, keep data
#   docker compose down -v           stop and delete the database volume
#
# DEMO_PASSWORD is required for `up` and comes from your shell or your local .env (never
# from this file). The PostgreSQL password below is a fallback for this local-only database,
# which is not published on a host port; the cloud uses Secret Manager instead.
name: nutgpuhub

x-database-url: &database-url
  DATABASE_URL: postgresql://${POSTGRES_USER:-nutgpuhub}:${POSTGRES_PASSWORD:-nutgpuhub-local}@db:5432/${POSTGRES_DB:-nutgpuhub}?schema=public

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nutgpuhub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nutgpuhub-local}
      POSTGRES_DB: ${POSTGRES_DB:-nutgpuhub}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Runs once: applies migrations, then the seed (safe to rerun), then exits 0.
  migrate:
    build: .
    image: nutgpuhub:local
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      <<: *database-url
      # Empty is allowed here so `docker compose ps/logs/down` work without it;
      # the seed itself stops with a clear error if it is missing or too short.
      DEMO_PASSWORD: ${DEMO_PASSWORD:-}
    command: ["sh", "-c", "npx prisma migrate deploy && npm run db:seed"]

  app:
    build: .
    image: nutgpuhub:local
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      <<: *database-url
      # Must match the address you open in the browser, or sign-in returns 403.
      APP_ORIGIN: http://localhost:${APP_PORT:-3000}
      COOKIE_SECURE: "false"
    ports:
      - "${APP_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/ready').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
